[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adbcbridge"
version = "0.1.0"
description = "Thin Python wrapper for adbcbridge, the ADBC driver for any ODBC data source"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "the adbcbridge authors" }]
keywords = ["adbc", "odbc", "arrow", "database", "sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
]
dependencies = [
  "adbc-driver-manager>=1.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://adbcbridge.org"
Source = "https://github.com/adbcbridge/adbcbridge"

[project.scripts]
adbcbridge = "adbcbridge.__main__:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adbcbridge = ["py.typed", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
