[package]
name = "adbc-odbc-rust-smoke"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Rust smoke test for the adbc-odbc driver, driven through the ADBC driver manager."

# This crate exists only for its integration test; there is no library to ship.
autolib = false

[dependencies]
adbc_core = "0.24"
adbc_driver_manager = "0.24"
arrow-array = "59"
arrow-schema = "59"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
