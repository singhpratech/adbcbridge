# Test servers for the adbcbridge compatibility matrix.
#   docker compose -f tests/compat/docker-compose.yml up -d
# The file-based entries need no service here: sqlite and duckdb create their database in
# a temp dir, and access reads tests/compat/fixtures/access.mdb (see README.md).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    ports: ["127.0.0.1:15432:5432"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: adbc, MARIADB_DATABASE: adbc, MARIADB_USER: adbc, MARIADB_PASSWORD: adbc }
    ports: ["127.0.0.1:13306:3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Adbc!Bridge2026" }
    ports: ["127.0.0.1:14331:1433"]
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: adbc, MYSQL_DATABASE: adbc, MYSQL_USER: adbc, MYSQL_PASSWORD: adbc }
    ports: ["127.0.0.1:13307:3306"]
  # Percona Server: a drop-in MySQL fork, so the MySQL Connector/ODBC entry drives it.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d percona
  percona:
    image: percona/percona-server:8.4
    profiles: ["extra"]
    environment: { MYSQL_ROOT_PASSWORD: adbc, MYSQL_DATABASE: adbc, MYSQL_USER: adbc, MYSQL_PASSWORD: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:13312:3306"]
  monetdb:
    image: monetdb/monetdb:latest
    environment: { MDB_DB_ADMIN_PASS: adbc, MDB_CREATE_DBS: adbc }
    ports: ["127.0.0.1:15000:50000"]
  # PostgreSQL plus the timescaledb extension (hypertables); psqlodbc drives it.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    ports: ["127.0.0.1:15434:5432"]
  # QuestDB: a time-series database that speaks the PostgreSQL wire protocol (8812);
  # 9000 is its HTTP console and REST API.  It is in the "extra" profile, so a plain
  # `up -d` leaves it alone -- start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d questdb
  # JAVA_OPTS caps the JVM heap; left alone QuestDB sizes it from total host RAM.
  questdb:
    image: questdb/questdb
    profiles: ["extra"]
    environment: { JAVA_OPTS: "-Xms256m -Xmx768m" }
    ports: ["127.0.0.1:18812:8812", "127.0.0.1:19000:9000"]
  # Citus: the citus extension on top of stock PostgreSQL (this image is PostgreSQL 18
  # + citus 14), sharding tables across a cluster.  In the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d citus
  # The single container is coordinator and worker at once; the matrix entry's `setup`
  # registers it in pg_dist_node so create_distributed_table() has somewhere to put
  # shards.  Port 15436 keeps it clear of the other PostgreSQL-wire entries.
  citus:
    profiles: ["extra"]
    image: citusdata/citus:latest
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:15436:5432"]
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure --cache=128MiB --max-sql-memory=128MiB
    ports: ["127.0.0.1:16257:26257", "127.0.0.1:18080:8080"]
  # Db2 Community Edition needs a privileged container and a few minutes to
  # initialise the "adbc" database on first start.
  db2:
    image: icr.io/db2_community/db2
    privileged: true
    environment: { LICENSE: accept, DB2INST1_PASSWORD: Adbc2026, DBNAME: adbc }
    ports: ["127.0.0.1:50000:50000"]
  firebird:
    image: firebirdsql/firebird:5
    # UTF8 default charset: the matrix connects with CHARSET=UTF8 and stores emoji.
    environment: { FIREBIRD_ROOT_PASSWORD: adbc, FIREBIRD_USER: adbc, FIREBIRD_PASSWORD: adbc,
                   FIREBIRD_DATABASE: adbc.fdb, FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8 }
    ports: ["127.0.0.1:13050:3050"]
  # Databend, a MySQL-wire analytic warehouse.  It is in the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d databend
  databend:
    image: datafuselabs/databend
    profiles: ["extra"]
    # The built-in "root" account; without QUERY_DEFAULT_PASSWORD it has no password.
    environment: { QUERY_DEFAULT_USER: root, QUERY_DEFAULT_PASSWORD: adbc }
    # 3307 is Databend's MySQL wire protocol port (8000 is its own HTTP API).
    ports: ["127.0.0.1:13311:3307"]
  # YugabyteDB (PostgreSQL-compatible distributed SQL).  yugabyted runs a master
  # and a tserver inside the one container; left alone they size their heaps as a
  # fraction of total host RAM.  The caps below keep the node under 1 GiB.
  yugabyte:
    image: yugabytedb/yugabyte:latest
    command: >
      bin/yugabyted start --background=false
      --tserver_flags=memory_limit_hard_bytes=805306368,use_memory_defaults_optimized_for_ysql=false
      --master_flags=memory_limit_hard_bytes=402653184,use_memory_defaults_optimized_for_ysql=false
    # 5433 is YSQL, the PostgreSQL wire-protocol port psqlodbc connects to.
    ports: ["127.0.0.1:15433:5433"]
  # CrateDB (distributed SQL over Lucene) speaks the PostgreSQL wire protocol on 5432.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d cratedb
  # discovery.type=single-node skips the bootstrap wait; CRATE_HEAP_SIZE caps the JVM.
  cratedb:
    profiles: ["extra"]
    image: crate
    command: crate -Cdiscovery.type=single-node
    environment: { CRATE_HEAP_SIZE: 512m }
    mem_limit: 2g
    ports: ["127.0.0.1:15440:5432"]
  # TiDB (MySQL wire protocol; MySQL Connector/ODBC drives it).  In the "extra"
  # profile, so the default `up -d` leaves it alone:
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d tidb
  # The image is a single tidb-server on its embedded unistore engine -- no PD and
  # no TiKV -- with root passwordless and no database but the built-in `test`.
  tidb:
    image: pingcap/tidb:latest
    profiles: ["extra"]
    mem_limit: 2g
    ports: ["127.0.0.1:14000:4000"]
  # Dolt ("git for data"): MySQL wire protocol, driven by MySQL Connector/ODBC.
  # Under the "extra" profile, so a plain `up -d` does not start it:
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d dolt
  # DOLT_ROOT_HOST=% is required: the image's root account is root@localhost otherwise,
  # which a client coming in through the published port cannot match.  The "adbc"
  # database is not created by an env var here -- see README.md for the one-line
  # `dolt sql -q` that creates it.
  dolt:
    image: dolthub/dolt-sql-server:latest
    profiles: ["extra"]
    environment: { DOLT_ROOT_HOST: "%" }
    ports: ["127.0.0.1:13310:3306"]
  # Azure SQL Edge: the SQL Server 2022 engine in a smaller, separately shipped image,
  # driven by the same msodbcsql 18 as the `mssql` service.  In the "extra" profile, so
  # a plain `up -d` leaves it alone (it would otherwise run a second SQL Server engine
  # alongside `mssql` for no extra coverage); start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d azuresqledge
  # This image takes ACCEPT_EULA=1, not the "Y" the mssql image wants.
  azuresqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    profiles: ["extra"]
    environment: { ACCEPT_EULA: "1", MSSQL_SA_PASSWORD: "Adbc!Bridge2026" }
    mem_limit: 2g
    ports: ["127.0.0.1:14332:1433"]
  # RisingWave: a streaming database that speaks the PostgreSQL wire protocol on 4566.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d risingwave
  # single_node runs meta, compute, frontend and compactor in one process.  The mounted
  # config pins the compactor's memory budget, which is otherwise a fraction of the
  # memory available to the process and falls below the compactor's own minimum in a
  # container this size -- see tests/compat/risingwave.toml.
  risingwave:
    profiles: ["extra"]
    image: risingwavelabs/risingwave:latest
    command: single_node --config-path /risingwave.toml
    volumes: ["./risingwave.toml:/risingwave.toml:ro"]
    mem_limit: 2g
    ports: ["127.0.0.1:14566:4566"]
  # OpenLink Virtuoso: an ODBC-native server -- 1111 is its own binary wire protocol,
  # which virtodbc.so speaks directly (8890 is its HTTP/SPARQL endpoint, unused here).
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d virtuoso
  virtuoso:
    profiles: ["extra"]
    image: openlink/virtuoso-opensource-7
    environment: { DBA_PASSWORD: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:11111:1111"]
  # IBM Informix 15 (developer edition).  In the "extra" profile, so a plain `up -d`
  # leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d informix
  # 9089 is the DRDA listener (the server's `informix_dr` alias); 9088 is Informix's own
  # SQLI protocol, which no ODBC driver here speaks.
  #   Do NOT add `privileged: true`: in a privileged container `sudo` inside this image
  # fails PAM account management, and the entrypoint drives its whole setup through
  # `sudo`, so the server never gets a DBSERVERNAME and never starts.
  #   GL_USEGLU=1 gives the server ICU-backed Unicode: without it a four-byte UTF-8
  # character (an emoji) in a parameter is rejected as an illegal character.
  #   DELIMIDENT=y makes the server read "..." as a delimited identifier rather than a
  # string literal, which is what the quoted identifiers adbc_ingest emits need.  For a
  # DRDA session this is set in the *server* environment; there is no client-side or
  # session-level equivalent.
  #   The image creates no user database, so create one -- with a UTF-8 locale, which is
  # not the image default -- once the container is up.  See README.md.
  informix:
    profiles: ["extra"]
    image: icr.io/informix/informix-developer-database:latest
    hostname: informix
    environment: { LICENSE: accept, GL_USEGLU: "1", DELIMIDENT: "y" }
    mem_limit: 2g
    ports: ["127.0.0.1:19089:9089"]
