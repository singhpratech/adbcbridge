# Test servers for the adbcbridge compatibility matrix.
#   docker compose -f tests/compat/docker-compose.yml up -d
# The file-based entries need no service here: sqlite and duckdb create their database in
# a temp dir, and access reads tests/compat/fixtures/access.mdb (see README.md).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    ports: ["127.0.0.1:15432:5432"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: adbc, MARIADB_DATABASE: adbc, MARIADB_USER: adbc, MARIADB_PASSWORD: adbc }
    ports: ["127.0.0.1:13306:3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Adbc!Bridge2026" }
    ports: ["127.0.0.1:14331:1433"]
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: adbc, MYSQL_DATABASE: adbc, MYSQL_USER: adbc, MYSQL_PASSWORD: adbc }
    ports: ["127.0.0.1:13307:3306"]
  # Percona Server: a drop-in MySQL fork, so the MySQL Connector/ODBC entry drives it.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d percona
  percona:
    image: percona/percona-server:8.4
    profiles: ["extra"]
    environment: { MYSQL_ROOT_PASSWORD: adbc, MYSQL_DATABASE: adbc, MYSQL_USER: adbc, MYSQL_PASSWORD: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:13312:3306"]
  monetdb:
    image: monetdb/monetdb:latest
    environment: { MDB_DB_ADMIN_PASS: adbc, MDB_CREATE_DBS: adbc }
    ports: ["127.0.0.1:15000:50000"]
  # PostgreSQL plus the timescaledb extension (hypertables); psqlodbc drives it.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    ports: ["127.0.0.1:15434:5432"]
  # QuestDB: a time-series database that speaks the PostgreSQL wire protocol (8812);
  # 9000 is its HTTP console and REST API.  It is in the "extra" profile, so a plain
  # `up -d` leaves it alone -- start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d questdb
  # JAVA_OPTS caps the JVM heap; left alone QuestDB sizes it from total host RAM.
  questdb:
    image: questdb/questdb
    profiles: ["extra"]
    environment: { JAVA_OPTS: "-Xms256m -Xmx768m" }
    ports: ["127.0.0.1:18812:8812", "127.0.0.1:19000:9000"]
  # Citus: the citus extension on top of stock PostgreSQL (this image is PostgreSQL 18
  # + citus 14), sharding tables across a cluster.  In the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d citus
  # The single container is coordinator and worker at once; the matrix entry's `setup`
  # registers it in pg_dist_node so create_distributed_table() has somewhere to put
  # shards.  Port 15436 keeps it clear of the other PostgreSQL-wire entries.
  citus:
    profiles: ["extra"]
    image: citusdata/citus:latest
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:15436:5432"]
  cockroachdb:
    image: cockroachdb/cockroach:latest
    # --max-go-memory: without it this build sets its Go soft memory limit to 288 MiB
    # and sits at 30% GC CPU (6-7 cores on an idle node), which poisons every
    # benchmark on the host; see "GC pressure detected" in its log.
    command: start-single-node --insecure --cache=128MiB --max-sql-memory=128MiB --max-go-memory=2GiB
    ports: ["127.0.0.1:16257:26257", "127.0.0.1:18080:8080"]
  # Db2 Community Edition needs a privileged container and a few minutes to
  # initialise the "adbc" database on first start.
  db2:
    image: icr.io/db2_community/db2
    privileged: true
    environment: { LICENSE: accept, DB2INST1_PASSWORD: Adbc2026, DBNAME: adbc }
    ports: ["127.0.0.1:50000:50000"]
  firebird:
    image: firebirdsql/firebird:5
    # UTF8 default charset: the matrix connects with CHARSET=UTF8 and stores emoji.
    environment: { FIREBIRD_ROOT_PASSWORD: adbc, FIREBIRD_USER: adbc, FIREBIRD_PASSWORD: adbc,
                   FIREBIRD_DATABASE: adbc.fdb, FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8 }
    ports: ["127.0.0.1:13050:3050"]
  # Databend, a MySQL-wire analytic warehouse.  It is in the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d databend
  databend:
    image: datafuselabs/databend
    profiles: ["extra"]
    # The built-in "root" account; without QUERY_DEFAULT_PASSWORD it has no password.
    environment: { QUERY_DEFAULT_USER: root, QUERY_DEFAULT_PASSWORD: adbc }
    # 3307 is Databend's MySQL wire protocol port (8000 is its own HTTP API).
    ports: ["127.0.0.1:13311:3307"]
  # YugabyteDB (PostgreSQL-compatible distributed SQL).  yugabyted runs a master
  # and a tserver inside the one container; left alone they size their heaps as a
  # fraction of total host RAM.  The caps below keep the node under 1 GiB.
  yugabyte:
    image: yugabytedb/yugabyte:latest
    command: >
      bin/yugabyted start --background=false
      --tserver_flags=memory_limit_hard_bytes=805306368,use_memory_defaults_optimized_for_ysql=false
      --master_flags=memory_limit_hard_bytes=402653184,use_memory_defaults_optimized_for_ysql=false
    # 5433 is YSQL, the PostgreSQL wire-protocol port psqlodbc connects to.
    ports: ["127.0.0.1:15433:5433"]
  # CrateDB (distributed SQL over Lucene) speaks the PostgreSQL wire protocol on 5432.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d cratedb
  # discovery.type=single-node skips the bootstrap wait; CRATE_HEAP_SIZE caps the JVM.
  cratedb:
    profiles: ["extra"]
    image: crate
    command: crate -Cdiscovery.type=single-node
    environment: { CRATE_HEAP_SIZE: 512m }
    mem_limit: 2g
    ports: ["127.0.0.1:15440:5432"]
  # TiDB (MySQL wire protocol; MySQL Connector/ODBC drives it).  In the "extra"
  # profile, so the default `up -d` leaves it alone:
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d tidb
  # The image is a single tidb-server on its embedded unistore engine -- no PD and
  # no TiKV -- with root passwordless and no database but the built-in `test`.
  tidb:
    image: pingcap/tidb:latest
    profiles: ["extra"]
    mem_limit: 2g
    ports: ["127.0.0.1:14000:4000"]
  # Dolt ("git for data"): MySQL wire protocol, driven by MySQL Connector/ODBC.
  # Under the "extra" profile, so a plain `up -d` does not start it:
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d dolt
  # DOLT_ROOT_HOST=% is required: the image's root account is root@localhost otherwise,
  # which a client coming in through the published port cannot match.  The "adbc"
  # database is not created by an env var here -- see README.md for the one-line
  # `dolt sql -q` that creates it.
  dolt:
    image: dolthub/dolt-sql-server:latest
    profiles: ["extra"]
    environment: { DOLT_ROOT_HOST: "%" }
    ports: ["127.0.0.1:13310:3306"]
  # Azure SQL Edge: the SQL Server 2022 engine in a smaller, separately shipped image,
  # driven by the same msodbcsql 18 as the `mssql` service.  In the "extra" profile, so
  # a plain `up -d` leaves it alone (it would otherwise run a second SQL Server engine
  # alongside `mssql` for no extra coverage); start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d azuresqledge
  # This image takes ACCEPT_EULA=1, not the "Y" the mssql image wants.
  azuresqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    profiles: ["extra"]
    environment: { ACCEPT_EULA: "1", MSSQL_SA_PASSWORD: "Adbc!Bridge2026" }
    mem_limit: 2g
    ports: ["127.0.0.1:14332:1433"]
  # RisingWave: a streaming database that speaks the PostgreSQL wire protocol on 4566.
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d risingwave
  # single_node runs meta, compute, frontend and compactor in one process.  The mounted
  # config pins the compactor's memory budget, which is otherwise a fraction of the
  # memory available to the process and falls below the compactor's own minimum in a
  # container this size -- see tests/compat/risingwave.toml.
  risingwave:
    profiles: ["extra"]
    image: risingwavelabs/risingwave:latest
    command: single_node --config-path /risingwave.toml
    volumes: ["./risingwave.toml:/risingwave.toml:ro"]
    mem_limit: 2g
    ports: ["127.0.0.1:14566:4566"]
  # OpenLink Virtuoso: an ODBC-native server -- 1111 is its own binary wire protocol,
  # which virtodbc.so speaks directly (8890 is its HTTP/SPARQL endpoint, unused here).
  # In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d virtuoso
  virtuoso:
    profiles: ["extra"]
    image: openlink/virtuoso-opensource-7
    environment: { DBA_PASSWORD: adbc }
    mem_limit: 2g
    ports: ["127.0.0.1:11111:1111"]
  # Materialize: a streaming warehouse with incrementally maintained materialized views,
  # reachable over the PostgreSQL wire protocol (psqlodbc drives it).  In the "extra"
  # profile, so a plain `up -d` leaves it alone:
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d materialize
  # The single-node image needs no configuration: it comes up with one `materialize`
  # superuser, no authentication and a `materialize` database.
  materialize:
    image: materialize/materialized:latest
    profiles: ["extra"]
    mem_limit: 2g
    ports: ["127.0.0.1:16875:6875"]
  # openGauss: Huawei's fork of PostgreSQL 9.2, speaking the PostgreSQL wire protocol on
  # 5432, so psqlodbc drives it.  In the "extra" profile, so a plain `up -d` leaves it
  # alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d opengauss
  # Three things this image needs that the other PostgreSQL-wire services here do not:
  #  * cap_add SYS_NICE -- openGauss's MOT (memory-optimized table) engine calls mbind(),
  #    which Docker's default seccomp profile rejects with EPERM unless the container has
  #    CAP_SYS_NICE.  Without it the postmaster dies during start-up ("mbind: Operation
  #    not permitted" -> "Failed to Initialize the Recovery Manager").
  #  * the `command` overrides -- gs_initdb sizes shared_buffers (1 GB) and
  #    max_process_memory (12 GB) from *host* RAM, which no small container can back.
  #    max_process_memory has a hard 2 GB lower bound, so mem_limit cannot go below 3g.
  #  * an `adbc` role and database created after the first start: openGauss refuses a
  #    remote login for the initial user, so the matrix cannot connect as it.  See
  #    README.md for the two gsql statements that create them.
  opengauss:
    image: enmotech/opengauss:latest
    profiles: ["extra"]
    environment: { GS_PASSWORD: "Adbc@2026" }
    command: ["-c", "shared_buffers=256MB", "-c", "max_process_memory=2GB", "-c", "max_connections=50"]
    cap_add: ["SYS_NICE"]
    shm_size: 1g
    mem_limit: 3g
    ports: ["127.0.0.1:15438:5432"]
  # MatrixOne: a hyper-converged (HTAP) database speaking the MySQL wire protocol on
  # 6001, driven by MySQL Connector/ODBC.  In the "extra" profile, so a plain `up -d`
  # leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d matrixone
  # The image ships the built-in `dump`/`111` account and no user database; the matrix
  # entry's `setup` creates `adbc` itself.  Port 16001 keeps it clear of the other
  # MySQL-wire entries.
  matrixone:
    image: matrixorigin/matrixone:latest
    profiles: ["extra"]
    mem_limit: 2g
    ports: ["127.0.0.1:16001:6001"]
  # IBM Informix 15 (developer edition).  In the "extra" profile, so a plain `up -d`
  # leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d informix
  # 9089 is the DRDA listener (the server's `informix_dr` alias); 9088 is Informix's own
  # SQLI protocol, which no ODBC driver here speaks.
  #   Do NOT add `privileged: true`: in a privileged container `sudo` inside this image
  # fails PAM account management, and the entrypoint drives its whole setup through
  # `sudo`, so the server never gets a DBSERVERNAME and never starts.
  #   GL_USEGLU=1 gives the server ICU-backed Unicode: without it a four-byte UTF-8
  # character (an emoji) in a parameter is rejected as an illegal character.
  #   DELIMIDENT=y makes the server read "..." as a delimited identifier rather than a
  # string literal, which is what the quoted identifiers adbc_ingest emits need.  For a
  # DRDA session this is set in the *server* environment; there is no client-side or
  # session-level equivalent.
  #   The image creates no user database, so create one -- with a UTF-8 locale, which is
  # not the image default -- once the container is up.  See README.md.
  informix:
    profiles: ["extra"]
    image: icr.io/informix/informix-developer-database:latest
    hostname: informix
    environment: { LICENSE: accept, GL_USEGLU: "1", DELIMIDENT: "y" }
    mem_limit: 2g
    ports: ["127.0.0.1:19089:9089"]
  # MariaDB ColumnStore: MariaDB's columnar storage engine (this image is MariaDB 11.1 +
  # ColumnStore 23.02), driven by the same MariaDB Connector/ODBC as the `mariadb`
  # service.  In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d columnstore
  # Two steps are needed after it comes up, neither of which the image does for you --
  # see tests/compat/README.md: `provision` (the ColumnStore backend processes are not
  # started by the entrypoint, and until they are every DDL fails with "DBRM is read
  # only!"), and creating the `adbc` database and user.  PM1/hostname must agree: the
  # node registers itself in the cluster under that name.  The mounted .cnf carries the
  # two server settings the matrix entry depends on.
  columnstore:
    profiles: ["extra"]
    image: mariadb/columnstore:latest
    hostname: mcs1
    environment: { PM1: mcs1, MARIADB_ROOT_PASSWORD: adbc }
    volumes: ["./columnstore.cnf:/etc/my.cnf.d/zz-adbc.cnf:ro"]
    mem_limit: 2g
    ports: ["127.0.0.1:13313:3306"]
  # Arrow Flight SQL: voltrondata/sqlflite serves a DuckDB database over Flight SQL on
  # 31337, which the Arrow Flight SQL ODBC driver connects to.  In the "extra" profile,
  # so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d flightsql
  # TLS_ENABLED=0 keeps the server on plain gRPC -- the matrix entry's connection string
  # says useEncryption=false to match.  SQLFLITE_PASSWORD is mandatory (the server exits
  # at startup without one) and pairs with sqlflite's default user name
  # `sqlflite_username`.  PRINT_QUERIES=0 stops it echoing every statement to its log.
  flightsql:
    profiles: ["extra"]
    image: voltrondata/sqlflite:latest
    environment: { SQLFLITE_PASSWORD: adbc, TLS_ENABLED: "0", PRINT_QUERIES: "0" }
    mem_limit: 2g
    ports: ["127.0.0.1:31337:31337"]
  # GreptimeDB: a time-series database that serves the MySQL wire protocol on 4002 and
  # the PostgreSQL one on 4003 (4000 is its HTTP API and dashboard, 4001 its gRPC).  In
  # the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d greptimedb
  # The matrix entry connects over the *MySQL* wire, driven by MySQL Connector/ODBC:
  # psqlodbc cannot complete SQLDriverConnect against the PostgreSQL port at all -- see
  # tests/compat/README.md.  Both ports are published anyway so that check can be redone.
  # The image needs no configuration: it comes up with a `greptime` catalog, a `public`
  # schema, one passwordless `greptime` user and no authentication.
  greptimedb:
    profiles: ["extra"]
    image: greptime/greptimedb:latest
    command: >
      standalone start --rpc-bind-addr 0.0.0.0:4001 --http-addr 0.0.0.0:4000
      --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003
    mem_limit: 1g
    ports: ["127.0.0.1:14002:4002", "127.0.0.1:14003:4003"]

  # ArcadeDB: a multi-model (document/graph/key-value) server that speaks the PostgreSQL
  # wire protocol through its PostgresProtocolPlugin, which is not loaded by default --
  # arcadedb.server.plugins is what turns it on, and arcadedb.postgres.port pins the
  # listener it opens (5432 is also its default, but the plugin only binds one when told).
  # arcadedb.server.defaultDatabases creates the `adbc` database and an `adbc` user on
  # first start; the matrix connects as `root`, whose password must be set explicitly or
  # the server prompts for one on a terminal it does not have.
  # In the `extra` profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d arcadedb
  # 15441 rather than 15433: that one is yugabyte's.
  arcadedb:
    profiles: ["extra"]
    image: arcadedata/arcadedb:latest
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=Adbc2026
        -Darcadedb.server.defaultDatabases=adbc[adbc:adbc]
        -Darcadedb.postgres.port=5432
        -Darcadedb.server.plugins=Postgres:com.arcadedb.postgres.PostgresProtocolPlugin
    mem_limit: 1g
    ports: ["127.0.0.1:15441:5432"]
  # InfluxDB 3 Core: a time-series database whose query interface is Arrow Flight SQL, on
  # the same port (8181) as its HTTP API -- the Arrow Flight SQL ODBC driver connects to
  # it, as it does to the `flightsql` service.  In the "extra" profile, so a plain `up -d`
  # leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d influxdb3
  # --without-auth runs the server with no token, which is what lets the ODBC connection
  # in without one; --object-store=memory keeps the database in RAM (removing the
  # container removes the data).  The matrix entry is read-only -- InfluxDB's SQL is
  # query-only and the driver has no SQLBindParameter -- so its two tables have to be
  # written over the HTTP API once the container is up, with
  #   python3 tests/compat/fixtures/load_influxdb3.py
  # See tests/compat/README.md.
  influxdb3:
    profiles: ["extra"]
    image: influxdb:3-core
    command: ["influxdb3", "serve", "--node-id=n1", "--object-store=memory", "--without-auth"]
    mem_limit: 2g
    ports: ["127.0.0.1:18181:8181"]
  # StarRocks: an MPP columnar warehouse serving the MySQL wire protocol on 9030, driven
  # by MySQL Connector/ODBC.  In the "extra" profile, so a plain `up -d` leaves it alone;
  # start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d starrocks
  # allin1-ubuntu runs the FE (frontend/coordinator, a JVM) and one BE (backend) in the
  # single container; it is ready in well under a minute and the BE sizes its own memory
  # limit from the container's, so mem_limit is the only knob needed.  The image ships no
  # user database and a passwordless `root`, so the matrix entry's `setup` creates `adbc`
  # itself.  Port 19030 keeps it clear of the other MySQL-wire entries.
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    profiles: ["extra"]
    mem_limit: 5g
    ports: ["127.0.0.1:19030:9030"]
  # Apache Ignite 2.x: a distributed in-memory key-value grid with a SQL engine on top.
  # 10800 is its thin-client port, which is also the ODBC one.  In the "extra" profile,
  # so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d ignite
  # The image ships no prebuilt ODBC driver, only the C++ sources it is built from
  # (/opt/ignite/apache-ignite/platforms/cpp); see tests/compat/README.md for the
  # root-free build.  JVM_OPTS pins the heap: Ignite sizes it from the *host's* RAM
  # rather than the container's limit, so on a large box the default would be well past
  # mem_limit.  Nothing else needs configuring -- the node comes up ACTIVE with a PUBLIC
  # schema and no authentication.
  ignite:
    profiles: ["extra"]
    image: apacheignite/ignite:latest
    environment: { JVM_OPTS: "-Xms512m -Xmx1200m" }
    mem_limit: 2g
    ports: ["127.0.0.1:11800:10800"]
  # OpenSearch with its bundled SQL plugin, reached over the REST API on 9200 -- the
  # OpenSearch SQL ODBC driver speaks to `/_plugins/_sql` there.  In the "extra" profile,
  # so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d opensearch
  # DISABLE_SECURITY_PLUGIN=true turns off TLS and authentication, which is what lets the
  # ODBC connection in with auth=NONE and useSSL=0; discovery.type=single-node skips the
  # cluster bootstrap.  OPENSEARCH_JAVA_OPTS pins a 512 MB heap -- the default is a
  # quarter of the host's RAM, far more than this needs.  The matrix entry is read-only
  # (the SQL plugin has no INSERT and the driver no SQLBindParameter), so its indices
  # have to be written over the REST API once the container is up, with
  #   python3 tests/compat/fixtures/load_opensearch.py
  # See tests/compat/README.md -- the driver is published for Windows and macOS only and
  # has to be built for Linux.
  opensearch:
    profiles: ["extra"]
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 3g
    ports: ["127.0.0.1:19200:9200"]
  # Apache Doris: an MPP analytic warehouse that serves the MySQL wire protocol on 9030
  # (8030 is the FE's HTTP console, 8040 the BE's).  In the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d doris
  # This is the all-in-one image: frontend and backend in one container, with the
  # passwordless `root` account and no user database (the matrix entry's `setup` creates
  # `adbc`).  It is not ready when the port opens: the BE registers with the FE a little
  # later, and until it does every CREATE TABLE fails.  Poll for it with
  #   docker exec adbcbridge-doris mysql -uroot -P9030 -h127.0.0.1 -e 'SHOW BACKENDS\G'
  # until `Alive: true` (about a minute from a cold start).  The single backend also means
  # the FE's three-replica default cannot be satisfied; the entry's `setup` sets
  # force_olap_table_replication_num=1 for that.  See tests/compat/README.md.
  #   Port 19031 keeps it clear of the other MySQL-wire entries.
  doris:
    profiles: ["extra"]
    image: apache/doris:doris-all-in-one-2.1.0
    mem_limit: 6g
    ports: ["127.0.0.1:19031:9030"]
  # Apache Cloudberry: the Greenplum fork -- an MPP cluster of PostgreSQL 14 segments
  # behind one coordinator, reachable over the PostgreSQL wire protocol (psqlodbc drives
  # it).  In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d cloudberry
  # There is no Apache-published server image (the apache/incubator-cloudberry tags are
  # CI build/test toolchains, not a runnable server), so this is the community image
  # from https://github.com/woblerr/docker-cloudberry, which packages Cloudberry
  # 2.1.0-incubating.  CLOUDBERRY_DEPLOYMENT=singlenode (the image default) brings up a
  # coordinator plus two primary segments in the one container, so tables really are
  # distributed -- which is what the entry's `extra` steps check.
  # First start runs gpinitsystem and takes ~2 minutes; the coordinator is on 5432
  # inside, and 15443 keeps it clear of the other PostgreSQL-wire entries.
  # shm_size is not optional: the segments talk over shared memory and gpinitsystem
  # fails against Docker's 64 MB default.
  cloudberry:
    profiles: ["extra"]
    image: woblerr/cloudberry:2.1.0-incubating
    environment: { CLOUDBERRY_PASSWORD: adbc, CLOUDBERRY_DATABASE_NAME: adbc }
    mem_limit: 3g
    shm_size: 1g
    ports: ["127.0.0.1:15443:5432"]
  # YDB: a distributed HTAP database whose native interface is gRPC/YQL, but which also
  # serves a PostgreSQL-compatible wire protocol on 5432 -- that is what the matrix entry
  # connects to, with psqlodbc.  In the "extra" profile, so a plain `up -d` leaves it
  # alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d ydb
  #   The `command` is not optional: the PG wire listener is there in every start, but
  # the SQL behind it is refused ("PG syntax is disabled") until the three feature flags
  # below are on, and this image's entrypoint has no environment variable for them -- it
  # passes its own arguments straight through to `local_ydb deploy`.  The names have to
  # be the *snake_case* protobuf field names of NKikimrConfig.TFeatureFlags: the config
  # the tool writes is snake_case throughout, and ydbd rejects an unknown field outright
  # ("unknown field \"EnablePgSyntax\"") and exits.
  #   hostname: localhost is what the cluster registers itself under; the node has to be
  # able to reach itself by that name.
  #   The image ships no users at all, and psqlodbc will not send an empty password, so
  # an `adbcuser` role has to be created once the container is up -- one `ydb sql`
  # command, see tests/compat/README.md.
  ydb:
    profiles: ["extra"]
    image: ydbplatform/local-ydb:latest
    hostname: localhost
    command: >
      --enable-feature-flag enable_pg_syntax
      --enable-feature-flag enable_table_pg_types
      --enable-feature-flag enable_temp_tables
    mem_limit: 3g
    ports: ["127.0.0.1:15444:5432"]

  # Vertica: a columnar analytics warehouse, reached over its own native protocol on 5433
  # with its own ODBC client driver (not a PostgreSQL wire, despite the port).  In the
  # "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d vertica
  #   tests/compat/fixtures/setup_vertica.sh
  # The second command is not optional: this image ships a server with no database and no
  # way to create one on its own -- it is built for the VerticaDB Kubernetes operator,
  # which drives `vcluster` from outside the pod -- so the entrypoint here only holds the
  # container open and the fixture script does the four steps that make a database.  See
  # the comments there and in tests/compat/README.md.
  # 25.3 rather than latest: Vertica 26.1 dropped Community Edition, and the CE licence
  # this image ships is refused outright by a 26.x server ("CE license is deprecated and
  # no longer supported"), so the catalog bootstrap fails.
  # user 0: the image's /etc/passwd has no `dbadmin` account even though every file it
  # ships is owned by uid 997, so the fixture script has to add one back; the server
  # itself then runs as dbadmin.  nofile 65536: Vertica's own start-up check refuses to
  # run below 32768 open file handles ("Host does not meet minimum requirements").
  # 15433 is free here -- the `yugabyte` entry uses it too, but neither is in the default
  # profile and they are never up at the same time.
  vertica:
    profiles: ["extra"]
    image: opentext/vertica-k8s:25.3.0-8-minimal
    user: "0"
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    ulimits:
      nofile: 65536
      nproc: 8192
    mem_limit: 4g
    ports: ["127.0.0.1:15433:5433"]
  # OceanBase CE: a distributed HTAP database whose MySQL mode serves the MySQL wire
  # protocol on 2881, driven by MySQL Connector/ODBC.  In the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d oceanbase
  #
  # MODE=SLIM is the setting that makes this entry practical, and it is not a size knob:
  # it selects the image's `fastboot` path, which unpacks a *prebuilt* single-node cluster
  # (squashfs images of the data and clog directories) and starts it, instead of having
  # `obd` deploy a cluster and create a tenant from scratch.  The default MODE=MINI takes
  # the second path and does not finish here: creating the tenant ends in
  # `ALTER SYSTEM LOAD MODULE DATA module = timezone`, which loads etc/timezone_V1.log
  # into mysql.time_zone_transition at a few rows a second on this box -- hours, against the
  # 1000 s ob_query_timeout obd sets, so the tenant create times out and the boot fails.
  # SLIM skips it: the prebuilt store already has the tenant and its timezone tables.
  # Booting takes about a minute and peaks at ~4.0 GiB, inside mem_limit 6g.
  #
  # OB_TENANT_NAME/OB_TENANT_PASSWORD/OB_DATABASE are still honoured on the SLIM path:
  # after the cluster is up the entrypoint waits for the tenant, creates OB_DATABASE in
  # it and sets root's password.  Wait for "boot success" in the log rather than for the
  # port -- the MySQL listener answers well before the tenant does.
  #
  # ulimits.nofile is a hard requirement, not tuning: obd refuses to work below 20000 open
  # files (OBD-1007) and Docker's default is 1024.
  oceanbase:
    profiles: ["extra"]
    image: oceanbase/oceanbase-ce:latest
    environment:
      MODE: SLIM
      OB_TENANT_NAME: test
      OB_TENANT_PASSWORD: adbc
      OB_DATABASE: adbc
    ulimits:
      nofile: { soft: 20000, hard: 20000 }
      stack: -1
    mem_limit: 6g
    ports: ["127.0.0.1:12881:2881"]
  # SingleStore (formerly MemSQL): a distributed HTAP database that serves the MySQL wire
  # protocol on 3306, driven by the same MySQL Connector/ODBC as the other MySQL-wire
  # entries.  In the "extra" profile, so a plain `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d singlestore
  #
  # singlestoredb-dev is the free development image: it carries its own Developer Image
  # licence, so unlike singlestore/cluster-in-a-box it needs no LICENSE_KEY and no
  # SingleStore account.  It runs a master and one leaf node in the container and is
  # ready in about half a minute; ROOT_PASSWORD is the only setting it needs.  The log
  # warns once that used cluster capacity (3 units) exceeds the licence's 1 unit --
  # that is the free licence describing itself, and nothing in the workload is refused.
  #
  # 8080 is SingleStore Studio, the bundled web UI, published on 18090 for a look at the
  # cluster; the matrix never touches it.  Port 13320 keeps the MySQL wire clear of the
  # other MySQL-wire entries (dolt already has 13310).  The image ships no user database,
  # so the matrix entry's `setup` creates `adbc` itself.
  singlestore:
    profiles: ["extra"]
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    environment: { ROOT_PASSWORD: "adbc" }
    mem_limit: 6g
    ports: ["127.0.0.1:13320:3306", "127.0.0.1:18090:8080"]
  # Dremio (OSS): a lakehouse query engine whose native client protocol is Arrow Flight
  # SQL, on 32010 -- the same Arrow Flight SQL ODBC driver as the `flightsql` and
  # `influxdb3` services connects to it (Dremio is the driver's publisher).  9047 is the
  # web UI and REST API.  In the "extra" profile, so a plain `up -d` leaves it alone;
  # start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d dremio
  # A stock Dremio has no users at all and refuses every login until the first admin is
  # created over the REST API, which has to be done once the container is up:
  #   curl -X PUT http://127.0.0.1:9047/apiv2/bootstrap/firstuser \
  #     -H 'Authorization: _dremionull' -H 'Content-Type: application/json' \
  #     -d '{"userName":"adbc","firstName":"adbc","lastName":"bridge",
  #          "email":"adbc@example.com","createdAt":1700000000000,
  #          "password":"Adbc2026pass"}'
  # The matrix entry's `setup` then builds its two tables itself, with CTAS into
  # $scratch (the one writable source a stock dremio-oss has): the entry is read-only
  # because the Arrow Flight SQL ODBC driver has no SQLBindParameter, not because Dremio
  # cannot write.  The server takes about 15 seconds to come up and settles at ~1.5 GB
  # resident with the image's own heap settings.  See tests/compat/README.md.
  dremio:
    profiles: ["extra"]
    image: dremio/dremio-oss:latest
    mem_limit: 5g
    ports: ["127.0.0.1:9047:9047", "127.0.0.1:32010:32010"]
  # TDengine: a time-series database, driven by its own ODBC driver (taos-odbc, built
  # from source -- see tests/compat/README.md).  In the "extra" profile, so a plain
  # `up -d` leaves it alone; start it with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d tdengine
  # TAOS_SERVER_PORT, hostname/TAOS_FQDN and the identically numbered published port are
  # not decoration: a native TDengine client connects to the endpoint the cluster
  # advertises for its dnode ("fqdn:serverPort"), not to the address it was handed, so
  # that endpoint has to resolve and connect from outside the container too.  With the
  # server on 16030 and 127.0.0.1:16030 published to it, the advertised
  # "localhost:16030" is reachable from the host unchanged.
  #   taosAdapter's REST/WebSocket port (6041) is not published: the ODBC driver used
  # here speaks the native protocol.
  tdengine:
    profiles: ["extra"]
    image: tdengine/tdengine:latest
    hostname: localhost
    environment: { TAOS_FQDN: localhost, TAOS_SERVER_PORT: "16030" }
    mem_limit: 2g
    ports: ["127.0.0.1:16030:16030"]
  # Google Cloud Spanner: the emulator plus PGAdapter, the PostgreSQL-wire proxy Google
  # ships for Spanner -- two containers, both free images and neither needing credentials
  # or a GCP project.  `spanner` is the emulator (Spanner's own gRPC API on 9010, its REST
  # API on 9020, neither published); `spanner-pg` is PGAdapter, which reaches it through
  # SPANNER_EMULATOR_HOST and serves the PostgreSQL wire protocol on 5432, published as
  # 15442 for the matrix entry.  Both are in the "extra" profile, so a plain `up -d`
  # leaves them alone; start them with
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d spanner-pg
  # (which brings the emulator up too).  autoConfigEmulator=true is what makes this a
  # one-command server: PGAdapter creates the instance and the database named by -i/-d on
  # the emulator at start-up, so nothing has to be provisioned first.  -x lets PGAdapter
  # accept a connection that does not come from localhost as seen inside the container;
  # publishing on 127.0.0.1 only is what keeps it private.
  spanner:
    profiles: ["extra"]
    image: gcr.io/cloud-spanner-emulator/emulator
    mem_limit: 2g
  spanner-pg:
    profiles: ["extra"]
    image: gcr.io/cloud-spanner-pg-adapter/pgadapter
    depends_on: [spanner]
    environment: { SPANNER_EMULATOR_HOST: "spanner:9010" }
    command: ["-p", "test-project", "-i", "test-instance", "-d", "test-database",
              "-x", "-r", "autoConfigEmulator=true"]
    mem_limit: 2g
    ports: ["127.0.0.1:15442:5432"]
  # MongoDB behind the MongoDB BI Connector: `mongosqld` reads the MongoDB in this same
  # container and serves the MySQL wire protocol over it on 3307, which MySQL
  # Connector/ODBC connects to.  In the "extra" profile, so a plain `up -d` leaves it
  # alone; it also needs MONGODB_BI_DIR pointing at the unpacked BI Connector (see
  # tests/compat/README.md -- it is a separate free download, not an image), so:
  #   MONGODB_BI_DIR=/tmp/dbs/mongodbbi/bi \
  #   docker compose -f tests/compat/docker-compose.yml --profile extra up -d mongodbbi
  # The image starts mongod only.  Once it is up, load the two collections and start
  # mongosqld on top of them -- the entry is read-only, mongosqld having no DDL and no
  # DML, so its tables have to be written into MongoDB directly:
  #   docker exec -i adbcbridge-mongodbbi mongosh --quiet < tests/compat/fixtures/load_mongodbbi.js
  #   docker exec -d adbcbridge-mongodbbi /opt/mongobi/mongosqld --addr 0.0.0.0:3307 \
  #     --mongo-uri mongodb://127.0.0.1:27017 --schema /etc/mongodbbi.drdl --logPath /tmp/mongosqld.log
  mongodbbi:
    profiles: ["extra"]
    image: mongo:7
    container_name: adbcbridge-mongodbbi
    # mongosqld is linked against OpenSSL 1.1, which this image does not have; keep
    # libssl.so.1.1 and libcrypto.so.1.1 in MONGODB_BI_DIR beside the binary (README).
    environment: { LD_LIBRARY_PATH: /opt/mongobi }
    volumes:
      - ${MONGODB_BI_DIR:-/nonexistent}:/opt/mongobi:ro
      - ./fixtures/mongodbbi.drdl:/etc/mongodbbi.drdl:ro
    mem_limit: 2g
    ports: ["127.0.0.1:13315:3307"]

  # Oracle and ClickHouse were long-lived standalone containers on the Linux host and
  # were missing here; these are the same images, environment and ports.  Both are in
  # the extra profile.  gvenzl/oracle-free publishes arm64 as well as amd64.
  oracle:
    profiles: ["extra"]
    image: gvenzl/oracle-free:slim
    environment: { ORACLE_PASSWORD: adbc, APP_USER: adbc, APP_USER_PASSWORD: adbc }
    ports: ["127.0.0.1:11521:1521"]
    mem_limit: 3g
  clickhouse:
    profiles: ["extra"]
    image: clickhouse/clickhouse-server:latest
    environment: { CLICKHOUSE_USER: adbc, CLICKHOUSE_PASSWORD: adbc, CLICKHOUSE_DB: adbc, TZ: UTC }
    ports: ["127.0.0.1:18123:8123", "127.0.0.1:19000:9000"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
