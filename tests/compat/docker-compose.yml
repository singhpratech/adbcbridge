# Test servers for the adbcbridge compatibility matrix.
#   docker compose -f tests/compat/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: adbc, POSTGRES_PASSWORD: adbc, POSTGRES_DB: adbc }
    ports: ["127.0.0.1:15432:5432"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: adbc, MARIADB_DATABASE: adbc, MARIADB_USER: adbc, MARIADB_PASSWORD: adbc }
    ports: ["127.0.0.1:13306:3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Adbc!Bridge2026" }
    ports: ["127.0.0.1:14331:1433"]
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: adbc, MYSQL_DATABASE: adbc, MYSQL_USER: adbc, MYSQL_PASSWORD: adbc }
    ports: ["127.0.0.1:13307:3306"]
  # Db2 Community Edition needs a privileged container and a few minutes to
  # initialise the "adbc" database on first start.
  db2:
    image: icr.io/db2_community/db2
    privileged: true
    environment: { LICENSE: accept, DB2INST1_PASSWORD: Adbc2026, DBNAME: adbc }
    ports: ["127.0.0.1:50000:50000"]
