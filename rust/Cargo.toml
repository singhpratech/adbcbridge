[package]
name = "adbcbridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Locate and load adbcbridge, the ADBC driver for any ODBC data source, through adbc_driver_manager"
repository = "https://github.com/singhpratech/adbcbridge"
homepage = "https://adbcbridge.org"
readme = "README.md"
keywords = ["adbc", "odbc", "arrow", "database", "driver"]
categories = ["database", "api-bindings"]
build = "build.rs"
# csrc/ is a verbatim copy of the C driver sources (see sync-csrc.sh); a
# crates.io package cannot reach outside its own directory, so it ships here.
exclude = ["target/"]

[features]
default = ["bundled"]
# Compile the driver from the bundled C sources at build time (needs a C
# compiler and the ODBC driver-manager headers: unixODBC or iODBC on Unix,
# the Windows SDK on Windows).  Without it the crate only *locates* an
# already-built libadbc_driver_odbc.
bundled = ["dep:cc"]

[dependencies]
adbc_core = "0.24"
adbc_driver_manager = "0.24"

[build-dependencies]
cc = { version = "1.0.83", optional = true }
