# Publish a tagged release's Java library to Maven Central through the Central
# Portal. The jar is rebuilt from the tag with the native libraries taken from
# that release's assets (the same recipe the Release workflow uses), then signed
# and uploaded by the central-publishing-maven-plugin in java/pom.xml's
# `release` profile.
#
# Needs four repository secrets: CENTRAL_USERNAME and CENTRAL_PASSWORD (a Central
# Portal user token), GPG_PRIVATE_KEY (an ASCII-armored private key whose public
# half is on keyserver.ubuntu.com) and GPG_PASSPHRASE. See java/PUBLISHING.md.
#
# By default the deployment is uploaded and validated but NOT released: it waits
# on https://central.sonatype.com/publishing/deployments for a human to press
# Publish (or Drop). Set `publish` to true to release automatically once
# validation passes.

name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.0"
        required: true
      publish:
        description: "Release automatically after validation (false = leave the deployment staged for review)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  maven:
    name: Publish ${{ inputs.tag }} (${{ inputs.publish && 'auto-publish' || 'validate and stage' }})
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: The POM version must match the tag
        run: |
          POM_VERSION=$(sed -n 's:.*<version>\([0-9][^<]*\)</version>.*:\1:p' java/pom.xml | head -1)
          [ "v$POM_VERSION" = "${{ inputs.tag }}" ] || { echo "::error::java/pom.xml says $POM_VERSION, tag is ${{ inputs.tag }}"; exit 1; }

      - name: Fetch the native libraries from the release
        run: |
          mkdir -p dl && cd dl
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern 'adbcbridge-*-linux-x64.tar.gz' --pattern 'adbcbridge-*-linux-arm64.tar.gz' --pattern 'adbcbridge-*-osx-arm64.tar.gz' --pattern 'adbcbridge-*-win-x64.tar.gz'
          for f in *.tar.gz; do tar xzf "$f"; done; rm -f *.tar.gz
          cd .. && mkdir -p natives
          for pair in linux-x64:linux-x86_64 linux-arm64:linux-aarch64 osx-arm64:macos-aarch64 win-x64:windows-x86_64; do
            rid=${pair%%:*}; osarch=${pair##*:}
            [ -d "dl/$rid" ] && cp -r "dl/$rid" "natives/$osarch"
          done
          ls -R natives
          [ "$(ls natives | wc -l)" = "4" ] || { echo "::error::expected four native directories"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Sign, upload and validate
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -f java/pom.xml -Prelease deploy -DskipTests \
            -Dadbcbridge.natives=$PWD/natives \
            -Dgpg.passphrase="$GPG_PASSPHRASE" \
            -Dcentral.autoPublish=${{ inputs.publish }}
          unzip -l java/target/adbcbridge-*[0-9].jar | grep native/
          ls -l java/target/*.asc

      - name: Where it went
        run: |
          echo "Deployment uploaded for ${{ inputs.tag }}."
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Auto-publish was on: once Central finishes, the artifact is at https://central.sonatype.com/artifact/org.adbcbridge/adbcbridge"
          else
            echo "Staged only: review and press Publish at https://central.sonatype.com/publishing/deployments"
          fi
