name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [""]
        include:
          # 32-bit Windows is a supported target: the Access, Excel and Text ODBC
          # drivers on a machine with 32-bit Office are 32-bit only, and ODBC cannot
          # mix bitness.  SQLLEN is 32 bits wide there, which is what this job checks.
          - os: windows-latest
            arch: Win32
    steps:
      - uses: actions/checkout@v7

      # Linux and macOS need an ODBC driver manager; Windows ships one.
      - name: Install unixODBC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install unixODBC (macOS)
        if: runner.os == 'macOS'
        run: brew install unixodbc

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix unixodbc)"

      - name: Configure
        if: runner.os != 'macOS' && matrix.arch == ''
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"

      # Release, not Debug: the configuration people ship is the one that has to pass.
      # An x86 /O2 /Ob2 test failure (see ResolvePartitionCount) was invisible to a Debug-only job.
      - name: Configure (Windows x86)
        if: matrix.arch == 'Win32'
        run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config ${{ matrix.arch == 'Win32' && 'Release' || 'Debug' }} --parallel 4

      - name: C unit tests
        run: ctest --test-dir build -C ${{ matrix.arch == 'Win32' && 'Release' || 'Debug' }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ matrix.arch == 'Win32' && 'Release' || 'Debug' }}

      - name: Show driver manifest
        if: runner.os != 'Windows'
        run: cat dist/etc/adbc/drivers/odbc.toml

      - name: Show driver manifest (Windows)
        if: runner.os == 'Windows'
        run: type dist\etc\adbc\drivers\odbc.toml
        shell: cmd

      # The end-to-end tests need an actual ODBC driver; SQLite is the cheapest
      # one to install, so they run on Linux only.
      - name: Install SQLite ODBC driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsqliteodbc

      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install --upgrade pip "adbc-driver-manager>=1.7" pyarrow

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: python tests/test_sqlite.py

      # The Python package (python/) is a thin wrapper around the library built
      # above; ADBC_ODBC_DRIVER points its driver lookup at that build.
      - name: Test the Python package (Linux)
        if: runner.os == 'Linux'
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: |
          python -m pip install pytest
          python -m pip install -e python
          python -m pytest python/tests -q

      # The Go binding (go/) drives the same library through arrow-adbc's cgo
      # driver manager; its tests skip themselves unless both variables are set.
      - name: Set up Go (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build and test the Go package (Linux)
        if: runner.os == 'Linux'
        working-directory: go
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: |
          go vet ./...
          go build ./...
          go test -v ./... 2>&1 | tee go-test.log
          grep -q -- '--- PASS' go-test.log || { echo "::error::no Go test ran (all skipped?)"; exit 1; }

      # The Rust crate, the .NET package and the Java library each carry a test
      # suite that opens SQLite through the library built above; every suite
      # skips itself without the two variables, so each step checks that tests
      # really ran.
      - name: Set up Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Test the Rust crate (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: |
          cargo test 2>&1 | tee cargo-test.log
          grep -E 'test result: ok\. [1-9][0-9]* passed' cargo-test.log >/dev/null || { echo "::error::no Rust test passed (all skipped or filtered?)"; exit 1; }

      - name: Set up .NET (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test the .NET package (Linux)
        if: runner.os == 'Linux'
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: |
          dotnet test csharp/AdbcBridge.Tests -c Release --nologo 2>&1 | tee dotnet-test.log
          grep -E 'Passed! .*Skipped: +0,' dotnet-test.log >/dev/null || { echo "::error::.NET tests did not all pass with zero skipped"; exit 1; }

      - name: Set up Java (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test the Java library (Linux)
        if: runner.os == 'Linux'
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          ADBC_ODBC_DRIVER: ${{ github.workspace }}/build/libadbc_driver_odbc.so
        run: |
          mvn -B -q -f java/pom.xml test 2>&1 | tee mvn-test.log
          grep -E 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' mvn-test.log >/dev/null || { echo "::error::Java tests did not all run and pass"; grep -E 'Tests run:' mvn-test.log || true; exit 1; }

      # Check that the installed manifest really lets the driver manager find
      # the driver by name.  Both install flavours are covered: the prefix
      # given at configure time (dist, installed above) and a prefix given at
      # install time with `cmake --install --prefix` (dist-relocated), which is
      # what the README's install instructions use.  The latter is a regression
      # test: the manifest used to freeze the library path at configure time,
      # so a relocated install shipped a manifest pointing at the old prefix.
      - name: Check driver manifest discovery (Linux)
        if: runner.os == 'Linux'
        env:
          SQLITE_ODBC_DRIVER: /usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
        run: |
          cmake --install build --config Debug --prefix "${{ github.workspace }}/dist-relocated"
          cat dist-relocated/etc/adbc/drivers/odbc.toml
          cat > check_manifest.py <<'PY'
          import os
          import adbc_driver_manager.dbapi as dbapi

          uri = f"Driver={os.environ['SQLITE_ODBC_DRIVER']};Database=:memory:;"
          with dbapi.connect(driver="odbc", db_kwargs={"uri": uri}) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1 AS one")
                  assert cur.fetch_arrow_table().to_pydict() == {"one": [1]}
          print("manifest discovery OK:", os.environ["ADBC_DRIVER_PATH"])
          PY
          for prefix in dist dist-relocated; do
            ADBC_DRIVER_PATH="${{ github.workspace }}/$prefix/etc/adbc/drivers" \
              python check_manifest.py
          done
