# Publish a tagged release's NuGet package to nuget.org through trusted
# publishing (short-lived API key from NuGet/login, no stored secret).  Needs, on
# nuget.org, a trusted publishing policy for repository owner "singhpratech",
# repository "adbcbridge", workflow "publish-nuget.yml", environment "nuget" --
# and a GitHub environment named "nuget" on this repository.  Run by hand with
# the tag once the Release workflow has published that tag; the nuget.org user
# name is the account that owns the policy.

name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.0"
        required: true
      nuget_user:
        description: "nuget.org user name that owns the trusted publishing policy"
        required: true

permissions:
  contents: read

jobs:
  nuget:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the package from the release
        run: |
          mkdir -p dist && cd dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.nupkg'
          ls -l
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Get a short-lived API key from nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user }}
      - name: Push
        run: |
          dotnet nuget push dist/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
