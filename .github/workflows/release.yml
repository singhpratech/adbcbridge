# Release: build the driver library on every supported platform, wrap it into the
# per-language packages, and put everything on a GitHub Release.
#
# Files move between jobs through the Release itself (`gh release upload` /
# `gh release download`), not through Actions artifacts: Releases are free and
# unmetered on every plan, artifacts are not. A workflow_dispatch run without a
# tag is a dry run against a draft release that the last job deletes.
#
# Every platform job produces the driver library, a Python wheel with it bundled
# (py3-none-<platform>: a C shared library, no Python extension module, so one
# wheel per platform serves every Python version) and the bare library as
# <rid>.tar.gz for the NuGet and Maven jobs. The OS's own ODBC driver manager
# (unixODBC / iODBC / odbc32) is deliberately NOT bundled: a foreign libodbc
# would change which odbcinst.ini the user's drivers are read from, so
# auditwheel/delocate run with it excluded.
#
# PyPI: the separate publish-pypi.yml publishes a tag's wheels through trusted
# publishing once the PyPI project has a trusted publisher for this repository
# and that workflow (environment "pypi").

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach assets to; empty = dry run on a draft release"
        required: false
        default: ""

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Create or reuse the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      dryrun: ${{ steps.tag.outputs.dryrun }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"; DRY=false
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"; DRY=false
          else
            TAG="dryrun-${{ github.run_number }}"; DRY=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "dryrun=$DRY" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; assets will be replaced"
          elif [ "$DRY" = true ]; then
            gh release create "$TAG" --draft --prerelease --title "dry run $TAG" --notes "Dry run of the release workflow; deleted automatically." --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --title "adbcBridge $TAG" --generate-notes
          fi

  linux:
    name: Linux ${{ matrix.arch }} (manylinux_2_28)
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    rid: linux-x64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install unixODBC headers and the GitHub CLI
        run: |
          dnf install -y unixODBC-devel
          dnf install -y 'dnf-command(config-manager)' && dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && dnf install -y gh
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build and repair the wheel
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          $PY -m pip install --upgrade build auditwheel
          ADBCBRIDGE_LIBRARY=$PWD/build/libadbc_driver_odbc.so $PY -m build --wheel python -o wheelhouse-raw
          $PY -m auditwheel repair --exclude libodbc.so.2 --plat manylinux_2_28_${{ matrix.arch }} -w wheelhouse wheelhouse-raw/*.whl
          ls -l wheelhouse
      - name: Upload to the release
        run: |
          mkdir -p natives/${{ matrix.rid }} && cp build/libadbc_driver_odbc.so natives/${{ matrix.rid }}/
          tar czf adbcbridge-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.tar.gz -C natives ${{ matrix.rid }}
          git config --global --add safe.directory "$PWD"
          gh release upload "${{ needs.prepare.outputs.tag }}" wheelhouse/*.whl adbcbridge-*-${{ matrix.rid }}.tar.gz --clobber

  macos:
    name: macOS arm64
    needs: prepare
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - run: brew install unixodbc
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix unixodbc)"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and repair the wheel
        run: |
          python -m pip install --upgrade build delocate
          # setup-python's macOS interpreter is a universal2 build, which would tag the
          # wheel universal2 and make delocate demand an x86_64 slice; the library is
          # arm64 only, so say so.
          _PYTHON_HOST_PLATFORM=macosx-14.0-arm64 ADBCBRIDGE_LIBRARY=$PWD/build/libadbc_driver_odbc.dylib \
            python -m build --wheel python -o wheelhouse-raw
          delocate-wheel --exclude libodbc --require-archs arm64 -w wheelhouse -v wheelhouse-raw/*.whl
          ls -l wheelhouse
      - name: Upload to the release
        run: |
          mkdir -p natives/osx-arm64 && cp build/libadbc_driver_odbc.dylib natives/osx-arm64/
          tar czf adbcbridge-${{ needs.prepare.outputs.tag }}-osx-arm64.tar.gz -C natives osx-arm64
          gh release upload "${{ needs.prepare.outputs.tag }}" wheelhouse/*.whl adbcbridge-*-osx-arm64.tar.gz --clobber

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and upload
        shell: bash
        run: |
          python -m pip install --upgrade build
          ADBCBRIDGE_LIBRARY=$PWD/build/Release/libadbc_driver_odbc.dll python -m build --wheel python -o wheelhouse
          ls -l wheelhouse
          mkdir -p natives/win-x64 && cp build/Release/libadbc_driver_odbc.dll natives/win-x64/
          tar czf adbcbridge-${{ needs.prepare.outputs.tag }}-win-x64.tar.gz -C natives win-x64
          gh release upload "${{ needs.prepare.outputs.tag }}" wheelhouse/*.whl adbcbridge-*-win-x64.tar.gz --clobber

  sdist:
    name: Source distribution
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build
          python -m build --sdist python -o sdist
          gh release upload "${{ needs.prepare.outputs.tag }}" sdist/*.tar.gz --clobber

  crate:
    name: Rust crate (cargo package)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the bundled sources are in sync, package, upload
        working-directory: rust
        run: |
          cargo test --release
          cargo package --allow-dirty
          gh release upload "${{ needs.prepare.outputs.tag }}" target/package/*.crate --clobber

  nuget:
    name: NuGet package with native assets
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the native libraries from the release
        run: |
          mkdir -p natives && cd natives
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern 'adbcbridge-*-linux-x64.tar.gz' --pattern 'adbcbridge-*-linux-arm64.tar.gz' --pattern 'adbcbridge-*-osx-arm64.tar.gz' --pattern 'adbcbridge-*-win-x64.tar.gz'
          for f in *.tar.gz; do tar xzf "$f"; done; rm -f *.tar.gz; ls -R
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Pack and upload
        run: |
          dotnet pack csharp/AdbcBridge -c Release -p:NativeRoot=$PWD/natives -o nupkg
          unzip -l nupkg/*.nupkg | grep runtimes/
          gh release upload "${{ needs.prepare.outputs.tag }}" nupkg/*.nupkg --clobber

  maven:
    name: Maven jar with natives
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the native libraries from the release
        run: |
          mkdir -p dl && cd dl
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern 'adbcbridge-*-linux-x64.tar.gz' --pattern 'adbcbridge-*-linux-arm64.tar.gz' --pattern 'adbcbridge-*-osx-arm64.tar.gz' --pattern 'adbcbridge-*-win-x64.tar.gz'
          for f in *.tar.gz; do tar xzf "$f"; done; rm -f *.tar.gz
          cd .. && mkdir -p natives
          for pair in linux-x64:linux-x86_64 linux-arm64:linux-aarch64 osx-arm64:macos-aarch64 win-x64:windows-x86_64; do
            rid=${pair%%:*}; osarch=${pair##*:}
            [ -d "dl/$rid" ] && cp -r "dl/$rid" "natives/$osarch"
          done; ls -R natives
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package and upload
        run: |
          mvn -q -B -f java/pom.xml package -DskipTests -Dadbcbridge.natives=$PWD/natives
          unzip -l java/target/adbcbridge-*[0-9].jar | grep native/
          gh release upload "${{ needs.prepare.outputs.tag }}" java/target/adbcbridge-*.jar --clobber

  trust:
    name: Checksums, signature, SBOM and provenance
    needs: [prepare, linux, macos, windows, sdist, crate, nuget, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every asset of the release
        run: |
          mkdir -p assets && cd assets
          gh release download "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}"
          rm -f SHA256SUMS SHA256SUMS.asc *.spdx.json
          ls -l
      - name: SHA256SUMS, signed with the release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd assets
          sha256sum $(ls | sort) > SHA256SUMS
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --armor --detach-sign SHA256SUMS 3<<<"$GPG_PASSPHRASE"
          gpg --verify SHA256SUMS.asc SHA256SUMS
      - name: SBOM of the source tree (SPDX JSON)
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: assets/adbcbridge-${{ needs.prepare.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance for every asset
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: assets/*
      - name: Attach
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" assets/SHA256SUMS assets/SHA256SUMS.asc assets/*.spdx.json --clobber

  finish:
    name: Publish the release (or delete the dry run)
    needs: [prepare, linux, macos, windows, sdist, crate, nuget, maven, trust]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if [ "${{ needs.prepare.outputs.dryrun }}" = "true" ]; then
            gh release view "$TAG" --json assets -q '.assets[].name'
            gh release delete "$TAG" --yes   # a draft has no tag to clean up
            echo "dry run: draft release deleted"
          elif [ "${{ needs.linux.result }}" = "success" ] && [ "${{ needs.macos.result }}" = "success" ] && [ "${{ needs.windows.result }}" = "success" ] && [ "${{ needs.sdist.result }}" = "success" ] && [ "${{ needs.crate.result }}" = "success" ] && [ "${{ needs.nuget.result }}" = "success" ] && [ "${{ needs.maven.result }}" = "success" ] && [ "${{ needs.trust.result }}" = "success" ]; then
            gh release edit "$TAG" --draft=false
            gh release view "$TAG" --json assets -q '.assets[].name'
          else
            echo "::error::one or more build jobs failed; $TAG stays a draft with the assets that did build"
            exit 1
          fi
