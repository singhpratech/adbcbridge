# Release: build the driver library on every supported platform, wrap it into
# the per-language packages, attach everything to a GitHub Release, and (on a
# tag) publish the Python wheels to PyPI through trusted publishing.
#
# Every platform job produces the same three things: the driver library, a
# Python wheel with it bundled, and the bare library under natives/<rid>/ for
# the NuGet, Maven and Go packaging jobs that follow. The wheels are tagged
# py3-none-<platform> -- there is no Python extension module in them, only a
# C shared library -- and depend on the OS's own ODBC driver manager
# (unixODBC / iODBC / odbc32), which is deliberately NOT bundled: bundling a
# foreign libodbc would change which odbcinst.ini the user's drivers are read
# from. auditwheel/delocate therefore run with that library excluded.
#
# Publishing to PyPI needs a trusted publisher configured on the PyPI project
# for this repository and workflow (environment "pypi"); without it the publish
# job fails and nothing else is affected. The crates.io, NuGet and Maven Central
# steps are documented in each package's README and run by a maintainer.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (manylinux_2_28)
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,        rid: linux-x64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm,     rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install unixODBC headers
        run: dnf install -y unixODBC-devel
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build and repair the wheel
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          $PY -m pip install --upgrade build auditwheel
          ADBCBRIDGE_LIBRARY=$PWD/build/libadbc_driver_odbc.so $PY -m build --wheel python -o wheelhouse-raw
          $PY -m auditwheel repair --exclude libodbc.so.2 --plat manylinux_2_28_${{ matrix.arch }} -w wheelhouse wheelhouse-raw/*.whl
          ls -l wheelhouse
      - name: Stage the bare library
        run: |
          mkdir -p natives/${{ matrix.rid }}
          cp build/libadbc_driver_odbc.so natives/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: wheel-${{ matrix.rid }}
          path: wheelhouse/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: native-${{ matrix.rid }}
          path: natives/
          retention-days: 7

  macos:
    name: macOS arm64
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - run: brew install unixodbc
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix unixodbc)"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and repair the wheel
        run: |
          python -m pip install --upgrade build delocate
          # setup-python's macOS interpreter is a universal2 build, which would tag
          # the wheel universal2 and make delocate demand an x86_64 slice; the
          # library is arm64 only, so say so.
          _PYTHON_HOST_PLATFORM=macosx-14.0-arm64 ADBCBRIDGE_LIBRARY=$PWD/build/libadbc_driver_odbc.dylib \
            python -m build --wheel python -o wheelhouse-raw
          delocate-wheel --exclude libodbc --require-archs arm64 -w wheelhouse -v wheelhouse-raw/*.whl
          ls -l wheelhouse
      - name: Stage the bare library
        run: |
          mkdir -p natives/osx-arm64
          cp build/libadbc_driver_odbc.dylib natives/osx-arm64/
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: wheel-osx-arm64
          path: wheelhouse/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: native-osx-arm64
          path: natives/
          retention-days: 7

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade build
          ADBCBRIDGE_LIBRARY=$PWD/build/Release/libadbc_driver_odbc.dll python -m build --wheel python -o wheelhouse
          ls -l wheelhouse
      - name: Stage the bare library
        shell: bash
        run: |
          mkdir -p natives/win-x64
          cp build/Release/libadbc_driver_odbc.dll natives/win-x64/
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: wheel-win-x64
          path: wheelhouse/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: native-win-x64
          path: natives/
          retention-days: 7

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build
          python -m build --sdist python -o sdist
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: sdist
          path: sdist/*.tar.gz
          retention-days: 7

  crate:
    name: Rust crate (cargo package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the bundled sources are in sync, then package
        working-directory: rust
        run: |
          cargo test --release
          cargo package --allow-dirty
          ls -l target/package/*.crate
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: crate
          path: rust/target/package/*.crate
          retention-days: 7

  nuget:
    name: NuGet package with native assets
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: |
          ls -R artifacts | head -20
          dotnet pack csharp/AdbcBridge -c Release -p:NativeRoot=$PWD/artifacts -o nupkg
          unzip -l nupkg/*.nupkg | grep runtimes/
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: nuget
          path: nupkg/*.nupkg
          retention-days: 7

  maven:
    name: Maven jar with natives
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Lay out natives as <os>-<arch> and package
        run: |
          mkdir -p natives
          [ -d artifacts/linux-x64 ]   && cp -r artifacts/linux-x64   natives/linux-x86_64
          [ -d artifacts/linux-arm64 ] && cp -r artifacts/linux-arm64 natives/linux-aarch64
          [ -d artifacts/osx-arm64 ]   && cp -r artifacts/osx-arm64   natives/macos-aarch64
          [ -d artifacts/win-x64 ]     && cp -r artifacts/win-x64     natives/windows-x86_64
          mvn -q -B -f java/pom.xml package -DskipTests -Dadbcbridge.natives=$PWD/natives
          unzip -l java/target/adbcbridge-*[0-9].jar | grep native/
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: maven
          path: java/target/adbcbridge-*.jar
          retention-days: 7

  release:
    name: GitHub Release
    needs: [linux, macos, windows, sdist, crate, nuget, maven]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lay out release assets
        run: |
          mkdir -p assets
          cp artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz assets/
          cp artifacts/crate/*.crate artifacts/nuget/*.nupkg artifacts/maven/*.jar assets/
          for d in artifacts/native-*/*/; do
            rid=$(basename "$d"); (cd "$d" && tar czf "$OLDPWD/assets/adbcbridge-${GITHUB_REF_NAME}-$rid.tar.gz" .)
          done
          ls -l assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p dist
          cp artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
