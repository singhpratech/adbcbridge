# Publish a tagged release's wheels and sdist to PyPI through trusted publishing.
# Needs, on pypi.org, a trusted publisher for owner "singhpratech", repository
# "adbcbridge", workflow "publish-pypi.yml", environment "pypi" -- and a GitHub
# environment named "pypi" on this repository. Run by hand with the tag once the
# Release workflow has published that tag.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the wheels and sdist from the release
        run: |
          mkdir -p dist && cd dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.whl' --pattern 'adbcbridge-*.tar.gz'
          rm -f adbcbridge-*-linux-*.tar.gz adbcbridge-*-osx-*.tar.gz adbcbridge-*-win-*.tar.gz   # the bare libraries, not the sdist
          ls -l
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
